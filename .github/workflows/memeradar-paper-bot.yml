name: MEME.RADAR Paper Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "meme-radar-bot.mjs"
      - "meme-radar-v5-*.mjs"
      - "memeradar-state-api/**"
      - "index.html"
      - "package.json"
      - ".github/workflows/memeradar-paper-bot.yml"

permissions:
  contents: write

concurrency:
  group: memeradar-paper-bot
  cancel-in-progress: false

jobs:
  paper-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out latest portfolio state
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check bot, modules and Worker syntax
        run: npm run check

      - name: Run v5 intelligence unit tests
        run: node --test meme-radar-v5-*.test.mjs

      - name: Require authenticated D1 state before bot run
        env:
          MEMERADAR_SYNC_SECRET: ${{ secrets.MEMERADAR_SYNC_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          const secret = process.env.MEMERADAR_SYNC_SECRET;
          if (!secret) throw new Error('MEMERADAR_SYNC_SECRET is missing in GitHub Actions repository secrets.');
          const response = await fetch('https://memeradar-state-api.varmaabhi47.workers.dev/state', {
            headers: { Authorization: 'Bearer ' + secret, 'Cache-Control': 'no-store' }
          });
          if (!response.ok) throw new Error('Authenticated D1 state check failed: HTTP ' + response.status);
          const data = await response.json();
          if (!data.portfolio || !Number.isSafeInteger(Number(data.version))) {
            throw new Error('D1 state row/version missing or invalid; refusing to run against local fallback.');
          }
          console.log('Authenticated D1 state OK | version ' + Number(data.version) +
            ' | open positions ' + (Array.isArray(data.portfolio.openPositions) ? data.portfolio.openPositions.length : 'invalid') +
            ' | closed trades ' + (Array.isArray(data.portfolio.closedTrades) ? data.portfolio.closedTrades.length : 'invalid'));
          NODE

      - name: Versioned D1 sync check after source update
        if: github.event_name == 'push' && vars.MEMERADAR_D1_SYNC_ENABLED == 'true'
        env:
          MEMERADAR_SYNC_SECRET: ${{ secrets.MEMERADAR_SYNC_SECRET }}
        run: node meme-radar-bot.mjs --sync-check

      - name: Run one paper-trading scan
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ github.event_name == 'workflow_dispatch' }}
          MEMERADAR_SYNC_SECRET: ${{ secrets.MEMERADAR_SYNC_SECRET }}
        run: node meme-radar-bot.mjs

      - name: Save portfolio and trade ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f paper_portfolio.json ]; then git add -f paper_portfolio.json; fi
          if [ -f paper_trades.csv ]; then git add -f paper_trades.csv; fi
          if [ -f paper_research.jsonl ]; then git add -f paper_research.jsonl; fi
          if git diff --cached --quiet; then
            echo "No portfolio changes to save."
          else
            git commit -m "Update MEME.RADAR paper portfolio"
            git push
          fi
