name: MEME.RADAR Paper Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: memeradar-paper-bot
  cancel-in-progress: false

jobs:
  paper-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out latest portfolio state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run one paper-trading scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ github.event_name == 'workflow_dispatch' }}
        run: node meme-radar-bot.mjs

      - name: Save portfolio and trade ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f paper_portfolio.json ]; then git add -f paper_portfolio.json; fi
          if [ -f paper_trades.csv ]; then git add -f paper_trades.csv; fi
          if git diff --cached --quiet; then
            echo "No portfolio changes to save."
          else
            git commit -m "Update MEME.RADAR paper portfolio"
            git push
          fi
