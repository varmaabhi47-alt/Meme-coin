name: Weekly smart-wallet decay pruning
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smart-wallet-weekly-prune
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prune wallets using live standard RPC and real research outcomes
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          HELIUS_RPC_URL: ${{ secrets.HELIUS_RPC_URL }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node smart-wallet-curator.mjs --prune
      - name: Commit updated curated wallet statuses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart_wallets.json
          if git diff --cached --quiet; then
            echo "No curated-wallet changes."
          else
            git commit -m "chore: weekly smart wallet decay pruning"
            git push
          fi
